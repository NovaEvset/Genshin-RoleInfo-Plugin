[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 默认跳过需要外部服务的集成测试；用 `pytest -m integration` 显式运行
addopts = -ra --strict-markers --durations=10 -m "not integration"
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: 需要外部服务或真实网络的集成测试（默认跳过）
